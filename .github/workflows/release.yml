---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      x64-sha256: ${{ steps.hash.outputs.x64 }}
      arm64-sha256: ${{ steps.hash.outputs.arm64 }}

    env:
      NUGET_PACKAGES: ${{ github.workspace }}/.nuget/packages
      DOTNET_CLI_WORKLOAD_UPDATE_NOTIFY_DISABLE: true

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Extract Version
        id: version
        env:
          GIT_REF: ${{ github.ref }}
        run: |
          $tag = "$env:GIT_REF" -replace 'refs/tags/v', ''
          Write-Output "version=$tag" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $tag"

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          cache: true
          cache-dependency-path: |
            global.json
            '**/packages.lock.json'

      - name: Install dependencies
        run: |
          dotnet restore
          dotnet restore Installer

      - name: Build
        run: |
          dotnet build --configuration Release --no-restore --property:Platform=x64
          dotnet build --configuration Release --no-restore --property:Platform=ARM64 Usbipd

      - name: Test
        run: |
          dotnet test --configuration Release --no-build --property:Platform=x64 `
            --report-spekt-junit `
            --coverage --coverage-output-format cobertura

      - name: Build x64 Installer
        run: |
          dotnet publish --configuration Release --no-build --runtime win-x64 --property:PublishProfile=x64 Usbipd
          dotnet publish --configuration Release --no-build Usbipd.PowerShell
          dotnet build --configuration Release --no-restore --property:Platform=x64 Installer

      - name: Build ARM64 Installer
        run: |
          dotnet publish --configuration Release --no-build --runtime win-arm64 --property:PublishProfile=arm64 Usbipd
          dotnet build --configuration Release --no-restore --property:Platform=ARM64 Installer

      - name: Calculate Checksums
        id: hash
        shell: pwsh
        run: |
          $x64File = Get-ChildItem "Installer/bin/x64/release/*.msi" | Select-Object -First 1
          $arm64File = Get-ChildItem "Installer/bin/ARM64/release/*.msi" | Select-Object -First 1

          $x64Hash = (Get-FileHash -Path $x64File.FullName -Algorithm SHA256).Hash
          $arm64Hash = (Get-FileHash -Path $arm64File.FullName -Algorithm SHA256).Hash

          Write-Output "x64=$x64Hash" >> $env:GITHUB_OUTPUT
          Write-Output "arm64=$arm64Hash" >> $env:GITHUB_OUTPUT

          Write-Host "x64 SHA256: $x64Hash"
          Write-Host "ARM64 SHA256: $arm64Hash"

      - name: Upload Artifacts
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: msi-installers
          path: 'Installer/bin/*/release/*.msi'
          retention-days: 30

      - name: Build Attestation
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-name: msi-installers.zip
          subject-digest: sha256:${{ steps.upload.outputs.artifact-digest }}

  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download Artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: msi-installers
          path: artifacts

      - name: Flatten Artifacts
        run: |
          find artifacts -mindepth 2 -name "*.msi" -exec mv {} artifacts/ \;
          echo "MSI files found:"
          ls artifacts/*.msi

      - name: Create Release Notes
        id: notes
        env:
          BUILD_VERSION: ${{ needs.build.outputs.version }}
          X64_SHA256: ${{ needs.build.outputs.x64-sha256 }}
          ARM64_SHA256: ${{ needs.build.outputs.arm64-sha256 }}
        run: |
          VERSION="$BUILD_VERSION"

          NOTES=$(cat <<EOF
          ## Release v${VERSION}

          ### Files
          - usbipd-win_${VERSION}_x64.msi
          - usbipd-win_${VERSION}_arm64.msi

          ### Checksums (SHA256)
          \`\`\`
          x64:
          ${X64_SHA256}

          arm64:
          ${ARM64_SHA256}
          \`\`\`

          ### Installation
          \`\`\`powershell
          winget install crisnsz.usbipd-win
          \`\`\`

          For more information, see the [documentation](https://github.com/crisnsz/usbipd-win/wiki).
          EOF
          )

          {
            echo "notes<<EOF"
            echo "$NOTES"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1
        with:
          tag: ${{ github.ref_name }}
          name: usbipd-win v${{ needs.build.outputs.version }}
          body: ${{ steps.notes.outputs.notes }}
          artifacts: artifacts/*.msi
          draft: false
          prerelease: ${{ contains(github.ref_name, '-alpha') || contains(github.ref_name, '-beta') || contains(github.ref_name, '-rc') }}
          token: ${{ secrets.GITHUB_TOKEN }}
