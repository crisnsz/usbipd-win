# zizmor security audit configuration
# https://docs.zizmor.sh/configuration/

# TODO: pin all action references to commit SHAs (unpinned-uses audit).
# Each `uses: action@vX` should be `uses: action@<sha>` for supply-chain security.
rules:
  unpinned-uses:
    disable: true
  cache-poisoning:
    disable: true
